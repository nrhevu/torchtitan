apiVersion: v1
kind: Service
metadata:
  name: torchft-lighthouse-32b-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
spec:
  selector:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
  ports:
    - name: http
      port: 29510
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torchft-lighthouse-32b-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-32b-torchft-2node
      app.kubernetes.io/component: lighthouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-32b-torchft-2node
        app.kubernetes.io/component: lighthouse
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: lighthouse
          image: 165.245.168.140:30088/mlops/torchft:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 29510
              protocol: TCP
          env:
            - name: RUST_BACKTRACE
              value: "1"
            - name: TORCHFT_MIN_REPLICAS
              value: "1"
            - name: TORCHFT_QUORUM_TICK_MS
              value: "10000"
            - name: TORCHFT_JOIN_TIMEOUT_MS
              value: "1000000"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-32b-torchft-2node-scripts
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: scripts
data:
  tokenize_dataset.py: |
    import os
    from pathlib import Path

    from datasets import load_dataset
    from transformers import AutoTokenizer

    dataset_path = os.environ["DATASET_PATH"]
    tokenizer_name = os.environ["TOKENIZER_NAME"]
    output_path = Path(os.environ["OUTPUT_PATH"])
    num_proc = int(os.environ["NUM_PROC"])
    max_train_samples = int(os.environ.get("MAX_TRAIN_SAMPLES", "0"))

    if output_path.exists() and any(output_path.iterdir()):
        raise FileExistsError(
            f"{output_path} already exists and is not empty. Move or remove it before rerunning."
        )

    output_path.mkdir(parents=True, exist_ok=True)

    dataset = load_dataset(dataset_path, split="train")
    if max_train_samples > 0:
        sample_count = min(max_train_samples, len(dataset))
        print(f"Selecting first {sample_count} examples for this smoke run...")
        dataset = dataset.select(range(sample_count))

    tokenizer = AutoTokenizer.from_pretrained(tokenizer_name, use_fast=True)

    def tokenize_function(examples):
        encodings = tokenizer.backend_tokenizer.encode_batch_fast(examples["text"])
        return {
            "input_ids": [encoding.ids for encoding in encodings],
            "attention_mask": [encoding.attention_mask for encoding in encodings],
        }

    print("Tokenizing dataset...")
    tokenized_dataset = dataset.map(tokenize_function, batched=True, num_proc=num_proc)

    print("Saving tokenized dataset...")
    tokenized_dataset.save_to_disk(str(output_path))
  train-multinode.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ -z "${REPLICA_ID:-}" && -n "${JOB_INDEX:-}" ]]; then
      export REPLICA_ID="${JOB_INDEX}"
    fi
    if [[ -z "${REPLICA_ID:-}" && -n "${JOB_NAME:-}" && "${JOB_NAME}" =~ -([0-9]+)$ ]]; then
      export REPLICA_ID="${BASH_REMATCH[1]}"
    fi
    if [[ -z "${NODE_RANK:-}" && -n "${JOB_COMPLETION_INDEX:-}" ]]; then
      export NODE_RANK="${JOB_COMPLETION_INDEX}"
    fi

    : "${REPLICA_ID:?REPLICA_ID is required}"
    : "${GROUP_SIZE:?GROUP_SIZE is required}"
    : "${NODE_RANK:?NODE_RANK is required}"
    : "${NNODES:?NNODES is required}"
    : "${NGPU:?NGPU is required}"
    : "${RDZV_BASE_PORT:?RDZV_BASE_PORT is required}"
    : "${TORCHFT_MANAGER_BASE_PORT:?TORCHFT_MANAGER_BASE_PORT is required}"
    : "${JOBSET_NAME:?JOBSET_NAME is required}"
    : "${REPLICATED_JOB_NAME:?REPLICATED_JOB_NAME is required}"
    : "${JOBSET_SUBDOMAIN:?JOBSET_SUBDOMAIN is required}"
    : "${POD_NAMESPACE:?POD_NAMESPACE is required}"
    : "${RUN_NAME:?RUN_NAME is required}"
    : "${STEPS:?STEPS is required}"
    : "${CHECKPOINT_INTERVAL:?CHECKPOINT_INTERVAL is required}"

    for numeric_name in REPLICA_ID GROUP_SIZE NODE_RANK NNODES NGPU RDZV_BASE_PORT TORCHFT_MANAGER_BASE_PORT STEPS CHECKPOINT_INTERVAL; do
      numeric_value="${!numeric_name:-}"
      if ! [[ "${numeric_value}" =~ ^[0-9]+$ ]]; then
        echo "${numeric_name} must be numeric, got '${numeric_value}'" >&2
        exit 1
      fi
    done
    if (( GROUP_SIZE < 1 )); then
      echo "GROUP_SIZE must be at least 1" >&2
      exit 1
    fi
    if (( REPLICA_ID >= GROUP_SIZE )); then
      echo "REPLICA_ID=${REPLICA_ID} must be smaller than GROUP_SIZE=${GROUP_SIZE}" >&2
      exit 1
    fi
    if (( NNODES < 1 )); then
      echo "NNODES must be at least 1" >&2
      exit 1
    fi
    if (( NODE_RANK >= NNODES )); then
      echo "NODE_RANK=${NODE_RANK} must be smaller than NNODES=${NNODES}" >&2
      exit 1
    fi

    export RDZV_PORT="${RDZV_PORT:-$((RDZV_BASE_PORT + REPLICA_ID))}"
    export TORCHFT_MANAGER_PORT="${TORCHFT_MANAGER_PORT:-$((TORCHFT_MANAGER_BASE_PORT + (REPLICA_ID * NNODES) + NODE_RANK))}"
    export MASTER_ADDR="${MASTER_ADDR:-${JOBSET_NAME}-${REPLICATED_JOB_NAME}-${REPLICA_ID}-0.${JOBSET_SUBDOMAIN}.${POD_NAMESPACE}.svc.cluster.local}"

    for numeric_name in RDZV_PORT TORCHFT_MANAGER_PORT; do
      numeric_value="${!numeric_name:-}"
      if ! [[ "${numeric_value}" =~ ^[0-9]+$ ]]; then
        echo "${numeric_name} must be numeric, got '${numeric_value}'" >&2
        exit 1
      fi
    done

    export MASTER_PORT="${RDZV_PORT}"
    export RUN_SUFFIX="r${REPLICA_ID}"
    export TRAIN_OUTPUT_DIR="./outputs/${RUN_NAME}/${RUN_SUFFIX}"
    export TRAIN_LOG="${TRAIN_OUTPUT_DIR}/trainer-node${NODE_RANK}.log"

    mkdir -p "$(dirname "${TORCHTITAN_CONFIG_PATH}")" ./assets/hf "${TRAIN_OUTPUT_DIR}"

    echo "TorchFT replica ${REPLICA_ID}/${GROUP_SIZE}; node_rank=${NODE_RANK}/${NNODES}; nproc_per_node=${NGPU}; rdzv=${MASTER_ADDR}:${RDZV_PORT}; manager_port=${TORCHFT_MANAGER_PORT}; host_ip=${NODE_ADDR:-unknown}; pod=${POD_NAME:-unknown}; job=${JOB_NAME:-unknown}"

    pip install torchft-nightly -q

    if [ ! -f ./assets/hf/Qwen3-32B/tokenizer.json ]; then
      python scripts/download_hf_assets.py \
        --repo_id Qwen/Qwen3-32B \
        --local_dir ./assets/hf \
        --assets tokenizer
    fi

    printf '%s\n' "${TORCHTITAN_TOML}" > "${TORCHTITAN_CONFIG_PATH}"

    set +e
    torchrun \
      --nnodes="${NNODES}" \
      --node_rank="${NODE_RANK}" \
      --nproc_per_node="${NGPU}" \
      --rdzv_backend c10d \
      --rdzv_id="${RUN_NAME}_replica_${REPLICA_ID}" \
      --rdzv_endpoint="${MASTER_ADDR}:${RDZV_PORT}" \
      --local-ranks-filter 0 \
      --role rank \
      --tee 3 \
      -m torchtitan.experiments.ft.train \
      --job.config_file "${TORCHTITAN_CONFIG_PATH}" \
      --job.dump_folder "${TRAIN_OUTPUT_DIR}" \
      --fault_tolerance.enable \
      --fault_tolerance.replica_id="${REPLICA_ID}" \
      --fault_tolerance.group_size="${GROUP_SIZE}" \
      --fault_tolerance.min_replica_size=1 \
      --fault_tolerance.process_group=gloo \
      --fault_tolerance.process_group_timeout_ms=120000 \
      --training.steps="${STEPS}" \
      2>&1 | tee "${TRAIN_LOG}"
    train_status=${PIPESTATUS[0]}
    set -e

    find "${TRAIN_OUTPUT_DIR}" -maxdepth 6 -print | sort | tee "${TRAIN_OUTPUT_DIR}/output-listing-node${NODE_RANK}.txt"
    exit "${train_status}"
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen3-32b-torchft-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: trainer
    app.kubernetes.io/instance: qwen3-32b-torchft-2node
spec:
  failurePolicy:
    maxRestarts: 0
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
    subdomain: qwen3-32b-torchft-2node
  replicatedJobs:
    - name: replica
      replicas: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen3-32b-torchft-2node
            app.kubernetes.io/component: trainer
            app.kubernetes.io/instance: qwen3-32b-torchft-2node
        spec:
          backoffLimit: 0
          completionMode: Indexed
          completions: 2
          parallelism: 2
          template:
            metadata:
              labels:
                app.kubernetes.io/name: qwen3-32b-torchft-2node
                app.kubernetes.io/component: trainer
                app.kubernetes.io/instance: qwen3-32b-torchft-2node
            spec:
              restartPolicy: Never
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              hostAliases:
                - ip: "165.245.173.141"
                  hostnames:
                    - vu
                    - vu.nguyen13-mlops-ubuntu-gpu-mi350x8
                - ip: "10.130.0.2"
                  hostnames:
                    - son
                    - son-le5-mlops-ubuntu-gpu-mi350x8-2304gb-ric1
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: qwen3-32b-torchft-2node
                          app.kubernetes.io/component: trainer
                      matchLabelKeys:
                        - batch.kubernetes.io/job-name
                      topologyKey: kubernetes.io/hostname
              terminationGracePeriodSeconds: 60
              initContainers:
                - name: downloader
                  image: 165.245.168.140:30088/mlops/downloader-v0:latest
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: S3_URL
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_URL
                    - name: S3_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_URL
                    - name: S3_ACCESS_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_ACCESS_TOKEN
                    - name: S3_SECRET_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_SECRET_TOKEN
                    - name: S3_REGION
                      value: "us-east-1"
                    - name: S3_DATAHUB_BUCKET
                      value: data-dev-1-bucket
                    - name: DATASET_ID
                      value: ccef405c-c9a1-4484-afe7-9d493d8efc11
                    - name: DATASET_PATH
                      value: /shared/dataset
                  volumeMounts:
                    - name: dataset
                      mountPath: /shared/dataset
                - name: tokenizer
                  image: 165.245.168.140:30088/training-workloads/torchtitan:rocm7.2.4
                  imagePullPolicy: IfNotPresent
                  workingDir: /workspace
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: HF_HOME
                      value: /workspace/torchtitan/assets/hf/cache
                    - name: HF_DATASETS_CACHE
                      value: /workspace/torchtitan/assets/hf/datasets
                    - name: TOKENIZERS_PARALLELISM
                      value: "false"
                    - name: DATASET_PATH
                      value: /shared/dataset
                    - name: TOKENIZER_NAME
                      value: Qwen/Qwen3-32B
                    - name: OUTPUT_PATH
                      value: /workspace/torchtitan/tokenized_data
                    - name: NUM_PROC
                      value: "32"
                    - name: MAX_TRAIN_SAMPLES
                      value: "200000"
                  command:
                    - python
                    - /scripts/tokenize_dataset.py
                  volumeMounts:
                    - name: dataset
                      mountPath: /shared/dataset
                      readOnly: true
                    - name: tokenized-data
                      mountPath: /workspace/torchtitan/tokenized_data
                    - name: hf-assets
                      mountPath: /workspace/torchtitan/assets/hf
                    - name: scripts
                      mountPath: /scripts
                      readOnly: true
              containers:
                - name: trainer
                  image: 165.245.168.140:30088/training-workloads/torchtitan:rocm7.2.4
                  imagePullPolicy: IfNotPresent
                  workingDir: /workspace/torchtitan
                  securityContext:
                    privileged: true
                    capabilities:
                      add:
                        - SYS_PTRACE
                    seccompProfile:
                      type: Unconfined
                  resources:
                    requests:
                      amd.com/gpu: "4"
                    limits:
                      amd.com/gpu: "4"
                  env:
                    - name: NODE_ADDR
                      valueFrom:
                        fieldRef:
                          fieldPath: status.hostIP
                    - name: POD_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: JOB_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                    - name: JOB_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JOBSET_NAME
                      value: qwen3-32b-torchft-2node
                    - name: JOBSET_SUBDOMAIN
                      value: qwen3-32b-torchft-2node
                    - name: REPLICATED_JOB_NAME
                      value: replica
                    - name: NNODES
                      value: "2"
                    - name: NGPU
                      value: "4"
                    - name: GROUP_SIZE
                      value: "2"
                    - name: RDZV_BASE_PORT
                      value: "29500"
                    - name: TORCHFT_MANAGER_BASE_PORT
                      value: "29520"
                    - name: RUN_NAME
                      value: qwen3_32b_ft_2node
                    - name: STEPS
                      value: "100"
                    - name: CHECKPOINT_INTERVAL
                      value: "50"
                    - name: TORCHTITAN_CONFIG_PATH
                      value: /tmp/qwen3_32b_ft_2node.toml
                    - name: TORCHFT_LIGHTHOUSE
                      value: "http://torchft-lighthouse-32b-2node.vunguyen13.svc.cluster.local:29510"
                    - name: TORCHFT_TIMEOUT_SEC
                      value: "120"
                    - name: TORCHFT_CONNECT_TIMEOUT_SEC
                      value: "120"
                    - name: TORCHFT_QUORUM_TIMEOUT_SEC
                      value: "120"
                    - name: NCCL_SOCKET_IFNAME
                      value: eth1
                    - name: GLOO_SOCKET_IFNAME
                      value: eth1
                    - name: NCCL_P2P_DISABLE
                      value: "1"
                    - name: RUST_LOG
                      value: info
                    - name: RUST_BACKTRACE
                      value: "1"
                    - name: PYTORCH_ALLOC_CONF
                      value: "expandable_segments:True"
                    - name: HF_HOME
                      value: /workspace/torchtitan/assets/hf/cache
                    - name: TORCHTITAN_TOML
                      value: |
                        [job]
                        dump_folder = "./outputs/qwen3_32b_ft_2node"
                        description = "Qwen3 32B TorchFT training, JobSet replicas with two nodes per replica"

                        [profiling]
                        enable_profiling = false

                        [metrics]
                        log_freq = 1
                        enable_tensorboard = false

                        [model]
                        name = "qwen3"
                        flavor = "32B"
                        hf_assets_path = "./assets/hf/Qwen3-32B"

                        [optimizer]
                        name = "AdamW"
                        lr = 8e-4
                        eps = 1e-8

                        [lr_scheduler]
                        warmup_steps = 1

                        [training]
                        local_batch_size = 1
                        seq_len = 128
                        max_norm = 1.0
                        steps = 100
                        dataset = "tokenized_disk"
                        dataset_path = "./tokenized_data"

                        [parallelism]
                        data_parallel_replicate_degree = 1
                        data_parallel_shard_degree = -1
                        fsdp_reshard_after_forward = "default"
                        tensor_parallel_degree = 1
                        context_parallel_degree = 1

                        [checkpoint]
                        enable = false
                        folder = "checkpoint"
                        interval = 50
                        last_save_model_only = false
                        export_dtype = "float16"
                        async_mode = "disabled"
                        keep_latest_k = 0

                        [activation_checkpoint]
                        mode = "full"
                        selective_ac_option = "op"

                        [compile]
                        enable = false
                        components = ["model", "loss"]

                        [quantize.linear.float8]
                        enable_fsdp_float8_all_gather = false
                        precompute_float8_dynamic_scale_for_fsdp = false
                        filter_fqns = ["output"]
                  command:
                    - bash
                    - /scripts/train-multinode.sh
                  volumeMounts:
                    - name: tokenized-data
                      mountPath: /workspace/torchtitan/tokenized_data
                    - name: hf-assets
                      mountPath: /workspace/torchtitan/assets/hf
                    - name: output
                      mountPath: /workspace/torchtitan/outputs
                    - name: scripts
                      mountPath: /scripts
                      readOnly: true
                    - name: dshm
                      mountPath: /dev/shm
              volumes:
                - name: dataset
                  emptyDir: {}
                - name: tokenized-data
                  emptyDir: {}
                - name: hf-assets
                  emptyDir: {}
                - name: output
                  emptyDir: {}
                - name: scripts
                  configMap:
                    name: qwen3-32b-torchft-2node-scripts
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
