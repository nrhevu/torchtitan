apiVersion: v1
kind: Service
metadata:
  name: torchft-lighthouse-32b-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
spec:
  selector:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
  ports:
    - name: http
      port: 29510
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torchft-lighthouse-32b-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: lighthouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-32b-torchft-2node
      app.kubernetes.io/component: lighthouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-32b-torchft-2node
        app.kubernetes.io/component: lighthouse
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: lighthouse
          image: 165.245.168.140:30088/mlops/torchft:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 29510
              protocol: TCP
          env:
            - name: RUST_BACKTRACE
              value: "1"
            - name: TORCHFT_MIN_REPLICAS
              value: "1"
            - name: TORCHFT_QUORUM_TICK_MS
              value: "10000"
            - name: TORCHFT_JOIN_TIMEOUT_MS
              value: "1000000"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: qwen3-32b-torchft-2node
  namespace: vunguyen13
  labels:
    app.kubernetes.io/name: qwen3-32b-torchft-2node
    app.kubernetes.io/component: trainer
    app.kubernetes.io/instance: qwen3-32b-torchft-2node
spec:
  failurePolicy:
    maxRestarts: 0
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
    subdomain: qwen3-32b-torchft-2node
  replicatedJobs:
    - name: replica
      replicas: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen3-32b-torchft-2node
            app.kubernetes.io/component: trainer
            app.kubernetes.io/instance: qwen3-32b-torchft-2node
        spec:
          backoffLimit: 0
          completionMode: Indexed
          completions: 2
          parallelism: 2
          template:
            metadata:
              labels:
                app.kubernetes.io/name: qwen3-32b-torchft-2node
                app.kubernetes.io/component: trainer
                app.kubernetes.io/instance: qwen3-32b-torchft-2node
            spec:
              restartPolicy: Never
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              hostAliases:
                - ip: "165.245.173.141"
                  hostnames:
                    - vu
                    - vu.nguyen13-mlops-ubuntu-gpu-mi350x8
                - ip: "10.130.0.2"
                  hostnames:
                    - son
                    - son-le5-mlops-ubuntu-gpu-mi350x8-2304gb-ric1
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: qwen3-32b-torchft-2node
                          app.kubernetes.io/component: trainer
                      matchLabelKeys:
                        - batch.kubernetes.io/job-name
                      topologyKey: kubernetes.io/hostname
              terminationGracePeriodSeconds: 60
              initContainers:
                - name: downloader
                  image: 165.245.168.140:30088/mlops/downloader-v0:latest
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: S3_URL
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_URL
                    - name: S3_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_URL
                    - name: S3_ACCESS_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_ACCESS_TOKEN
                    - name: S3_SECRET_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: mlops-s3-credentials
                          key: S3_SECRET_TOKEN
                    - name: S3_REGION
                      value: "us-east-1"
                    - name: S3_DATAHUB_BUCKET
                      value: data-dev-1-bucket
                    - name: DATASET_ID
                      value: ccef405c-c9a1-4484-afe7-9d493d8efc11
                    - name: DATASET_PATH
                      value: /shared/dataset
                  volumeMounts:
                    - name: dataset
                      mountPath: /shared/dataset
                - name: tokenizer
                  image: 165.245.168.140:30088/training-workloads/torchtitan:rocm7.2.4
                  imagePullPolicy: Always
                  workingDir: /workspace
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: HF_HOME
                      value: /workspace/torchtitan/assets/hf/cache
                    - name: HF_DATASETS_CACHE
                      value: /workspace/torchtitan/assets/hf/datasets
                    - name: TOKENIZERS_PARALLELISM
                      value: "false"
                    - name: DATASET_PATH
                      value: /shared/dataset
                    - name: TOKENIZER_NAME
                      value: Qwen/Qwen3-32B
                    - name: OUTPUT_PATH
                      value: /workspace/torchtitan/tokenized_data
                    - name: NUM_PROC
                      value: "32"
                    - name: MAX_TRAIN_SAMPLES
                      value: "200000"
                  command:
                    - python
                    - /workspace/torchtitan/scripts/tokenize_dataset.py
                  volumeMounts:
                    - name: dataset
                      mountPath: /shared/dataset
                      readOnly: true
                    - name: tokenized-data
                      mountPath: /workspace/torchtitan/tokenized_data
                    - name: hf-assets
                      mountPath: /workspace/torchtitan/assets/hf
              containers:
                - name: trainer
                  image: 165.245.168.140:30088/training-workloads/torchtitan:rocm7.2.4
                  imagePullPolicy: Always
                  workingDir: /workspace/torchtitan
                  securityContext:
                    privileged: true
                    capabilities:
                      add:
                        - SYS_PTRACE
                    seccompProfile:
                      type: Unconfined
                  resources:
                    requests:
                      cpu: "16"
                      memory: "128Gi"
                      amd.com/gpu: 4
                    limits:
                      cpu: "32"
                      memory: "256Gi"
                      amd.com/gpu: 4
                  env:
                    - name: NODE_ADDR
                      valueFrom:
                        fieldRef:
                          fieldPath: status.hostIP
                    - name: POD_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: JOB_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                    - name: JOB_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: REPLICA_ID
                      value: "$(JOB_INDEX)"
                    - name: NODE_RANK
                      value: "$(JOB_COMPLETION_INDEX)"
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: JOBSET_NAME
                      value: qwen3-32b-torchft-2node
                    - name: JOBSET_SUBDOMAIN
                      value: qwen3-32b-torchft-2node
                    - name: REPLICATED_JOB_NAME
                      value: replica
                    - name: RDZV_HOST_RANK
                      value: "0"
                    - name: MASTER_ADDR
                      value: "$(JOBSET_NAME)-$(REPLICATED_JOB_NAME)-$(JOB_INDEX)-$(RDZV_HOST_RANK).$(JOBSET_SUBDOMAIN).$(POD_NAMESPACE).svc.cluster.local"
                    - name: NNODES
                      value: "2"
                    - name: NGPU
                      value: "4"
                    - name: GROUP_SIZE
                      value: "2"
                    - name: RDZV_BASE_PORT
                      value: "29500"
                    - name: TORCHFT_MANAGER_BASE_PORT
                      value: "29520"
                    - name: RUN_NAME
                      value: qwen3_32b_ft_2node
                    - name: STEPS
                      value: "100"
                    - name: CHECKPOINT_INTERVAL
                      value: "50"
                    - name: TORCHTITAN_CONFIG_PATH
                      value: /tmp/qwen3_32b_ft_2node.toml
                    - name: TORCHFT_LIGHTHOUSE
                      value: "http://torchft-lighthouse-32b-2node.vunguyen13.svc.cluster.local:29510"
                    - name: TORCHFT_TIMEOUT_SEC
                      value: "120"
                    - name: TORCHFT_CONNECT_TIMEOUT_SEC
                      value: "120"
                    - name: TORCHFT_QUORUM_TIMEOUT_SEC
                      value: "120"
                    - name: NCCL_SOCKET_IFNAME
                      value: eth1
                    - name: GLOO_SOCKET_IFNAME
                      value: eth1
                    - name: NCCL_P2P_DISABLE
                      value: "1"
                    - name: RUST_LOG
                      value: info
                    - name: RUST_BACKTRACE
                      value: "1"
                    - name: PYTORCH_ALLOC_CONF
                      value: "expandable_segments:True"
                    - name: HF_HOME
                      value: /workspace/torchtitan/assets/hf/cache
                    - name: HYPERPARAMETERS
                      value: |
                        {
                          "job": {
                            "dump_folder": "./outputs/qwen3_32b_ft_2node",
                            "description": "Qwen3 32B TorchFT training, JobSet replicas with two nodes per replica"
                          },
                          "profiling": {
                            "enable_profiling": false
                          },
                          "metrics": {
                            "log_freq": 1,
                            "enable_tensorboard": false
                          },
                          "model": {
                            "name": "qwen3",
                            "flavor": "32B",
                            "hf_assets_path": "./assets/hf/Qwen3-32B"
                          },
                          "optimizer": {
                            "name": "AdamW",
                            "lr": 3.0e-4,
                            "eps": 1.0e-8
                          },
                          "lr_scheduler": {
                            "warmup_steps": 2
                          },
                          "training": {
                            "local_batch_size": 4,
                            "seq_len": 4096,
                            "max_norm": 1.0,
                            "steps": 100,
                            "dataset": "tokenized_disk",
                            "dataset_path": "./tokenized_data"
                          },
                          "parallelism": {
                            "data_parallel_replicate_degree": 1,
                            "data_parallel_shard_degree": -1,
                            "fsdp_reshard_after_forward": "default",
                            "tensor_parallel_degree": 1,
                            "context_parallel_degree": 1
                          },
                          "checkpoint": {
                            "enable": false,
                            "folder": "checkpoint",
                            "interval": 50,
                            "last_save_model_only": false,
                            "export_dtype": "float16",
                            "async_mode": "disabled",
                            "keep_latest_k": 0
                          },
                          "activation_checkpoint": {
                            "mode": "full",
                            "selective_ac_option": "op"
                          },
                          "compile": {
                            "enable": true,
                            "components": ["model", "loss"]
                          }
                        }
                  command:
                    - bash
                    - -lc
                  args:
                    - |
                      python /workspace/torchtitan/scripts/write_json2toml.py
                      exec bash /workspace/torchtitan/scripts/train-multinode.sh
                  volumeMounts:
                    - name: tokenized-data
                      mountPath: /workspace/torchtitan/tokenized_data
                    - name: hf-assets
                      mountPath: /workspace/torchtitan/assets/hf
                    - name: output
                      mountPath: /workspace/torchtitan/outputs
                    - name: dshm
                      mountPath: /dev/shm
              volumes:
                - name: dataset
                  emptyDir: {}
                - name: tokenized-data
                  emptyDir: {}
                - name: hf-assets
                  emptyDir: {}
                - name: output
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
